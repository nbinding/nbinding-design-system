<!doctype html>
<html lang="en" data-root="..">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; base-uri 'none'; form-action 'none'">
<title>Forms · nbinding design</title>
<link rel="stylesheet" href="../src/nb.css">
<link rel="stylesheet" href="docs.css">
<script type="module" src="docs.js"></script>
</head>
<body>
<header data-docs-header></header>
<main id="main" class="docs-main" tabindex="-1">
<h1 class="nb-display">Forms</h1>
<p class="nb-lead">Labels above fields, hints below, errors in words. Fields sit on the panel colour without borders.</p>

<template class="docs-src" data-title="Text field" data-notes="">
<label class="nb-field"><span class="nb-field__label">Your name</span><input class="nb-input" autocomplete="given-name" placeholder="e.g. Sam"></label>
</template>

<template class="docs-src" data-title="Optional field with hint" data-notes="">
<div class="nb-field"><label class="nb-field__label" for="f-title">What's it for? <small>Optional</small></label><input class="nb-input" id="f-title" aria-describedby="f-title-hint" placeholder="Dinner, a call, the hike"><p class="nb-field__hint" id="f-title-hint">Shown at the top of the plan.</p></div>
</template>

<template class="docs-src" data-title="Field with error" data-notes="">
<div class="nb-field"><label class="nb-field__label" for="f-pass">Passphrase</label><input class="nb-input" id="f-pass" aria-invalid="true" aria-describedby="f-pass-err" value="oak"><p class="nb-field__error" id="f-pass-err" role="alert">Use a passphrase of at least 6 characters.</p></div>
</template>

<template class="docs-src" data-title="Field with a button" data-notes="">
<div class="nb-field"><span class="nb-field__label" id="f-words-l">The words that open it</span><div class="nb-input-row"><input class="nb-input nb-input--mono" aria-labelledby="f-words-l" value="orbit-forest-wren"><button class="nb-icon-button" aria-label="Suggest new words"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7L21 8M21 3v5h-5"/></svg></button></div></div>
</template>

<template class="docs-src" data-title="Select" data-notes="">
<label class="nb-field"><span class="nb-field__label">Starting</span><select class="nb-select"><option>November 2026</option><option>December 2026</option></select></label>
</template>

<template class="docs-src" data-title="Textarea" data-notes="">
<label class="nb-field"><span class="nb-field__label">Message</span><textarea class="nb-textarea" rows="4">Can we find a day for dinner?</textarea></label>
</template>

<template class="docs-src" data-title="Segmented control" data-notes="A radiogroup of buttons. Try it.">
<div class="nb-field"><span class="nb-field__label" id="seg-l">Who's it for?</span><div class="nb-segmented" role="radiogroup" aria-labelledby="seg-l"><button role="radio" aria-checked="true">One person</button><button role="radio" aria-checked="false">A group</button></div></div>
</template>

<template class="docs-src" data-title="Option tiles" data-notes="">
<fieldset class="nb-field"><legend class="nb-field__label">Text size</legend><div class="nb-options"><button aria-pressed="true">Standard<small>100%</small></button><button aria-pressed="false">Large<small>115%</small></button><button aria-pressed="false">Larger<small>130%</small></button><button aria-pressed="false">Largest<small>150%</small></button></div></fieldset>
</template>

<template class="docs-src" data-title="Toggle" data-notes="">
<label class="nb-toggle"><input type="checkbox" checked><span class="nb-toggle__text"><strong>Help with dates</strong><small>Show the weekday inside every day and label today.</small></span></label>
</template>

<template class="docs-src" data-title="Choice rows (checkboxes)" data-notes="">
<ul class="nb-choices"><li><label class="nb-choice"><input type="checkbox" checked><span class="nb-choice__text"><strong>Saturday, 21 November</strong><small>Any time (maybe)</small></span></label></li><li><label class="nb-choice"><input type="checkbox"><span class="nb-choice__text"><strong>Friday, 27 November</strong><small>Morning</small></span></label></li></ul>
</template>

<template class="docs-src" data-title="Choice rows (radios)" data-notes="">
<ul class="nb-choices"><li><label class="nb-choice"><input type="radio" name="final" checked><span class="nb-choice__text"><strong>Saturday, 21 November</strong><small>4 of 4 can make it</small></span></label></li><li><label class="nb-choice"><input type="radio" name="final"><span class="nb-choice__text"><strong>Sunday, 22 November</strong><small>2 of 4 can make it</small></span></label></li></ul>
</template>


</main>
<footer class="docs-foot" data-docs-footer></footer>
</body>
</html>
