version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    # Keep @playwright/test in step with the browsers used in development.
    ignore:
      - dependency-name: '@playwright/test'
        update-types: ['version-update:semver-minor', 'version-update:semver-patch']
