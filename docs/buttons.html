<!doctype html>
<html lang="en" data-root="..">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; base-uri 'none'; form-action 'none'">
<title>Buttons · nbinding design</title>
<link rel="stylesheet" href="../src/nb.css">
<link rel="stylesheet" href="docs.css">
<script type="module" src="docs.js"></script>
</head>
<body>
<header data-docs-header></header>
<main id="main" class="docs-main" tabindex="-1">
<h1 class="nb-display">Buttons</h1>
<p class="nb-lead">One primary action per screen. Everything is at least 44px tall; primary buttons are 60px.</p>

<template class="docs-src" data-title="Primary" data-notes="">
<button class="nb-button">Create my link</button>
</template>

<template class="docs-src" data-title="Primary with trailing arrow, full width" data-notes="Use in the dock and at the end of a form.">
<button class="nb-button nb-button--block nb-button--trailing">Send to someone<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
</template>

<template class="docs-src" data-title="Primary with leading icon" data-notes="">
<button class="nb-button nb-button--block"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 15V3M7 8l5-5 5 5M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg>Send the link</button>
</template>

<template class="docs-src" data-title="Secondary" data-notes="Second most important action. Outlined, never a different colour.">
<button class="nb-button nb-button--secondary nb-button--block"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2.5"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg>Copy the words</button>
</template>

<template class="docs-src" data-title="Disabled" data-notes="Use the disabled attribute so it is skipped and announced as dimmed.">
<button class="nb-button" disabled>Lock in this day</button>
</template>

<template class="docs-src" data-title="Text button" data-notes="Low-emphasis actions and back links.">
<div class="nb-row"><button class="nb-text-button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>Change my days</button><button class="nb-text-button">Times and maybes</button></div>
</template>

<template class="docs-src" data-title="Icon buttons" data-notes="Always give an aria-label.">
<div class="nb-row"><button class="nb-icon-button" aria-label="Previous month"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></button><button class="nb-icon-button" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button><button class="nb-icon-button" aria-label="Suggest new words"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7L21 8M21 3v5h-5"/></svg></button></div>
</template>

<template class="docs-src" data-title="Chips" data-notes="Header actions and quick shortcuts.">
<div class="nb-row"><a class="nb-chip" href="#">Your plans</a><button class="nb-chip" aria-label="Display and accessibility settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg><span>Display</span></button><button class="nb-chip nb-chip--sm">+ Weekends</button><button class="nb-chip nb-chip--sm">Clear month</button></div>
</template>


</main>
<footer class="docs-foot" data-docs-footer></footer>
</body>
</html>
