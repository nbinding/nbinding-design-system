<!doctype html>
<html lang="en" data-root="..">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; base-uri 'none'; form-action 'none'">
<title>Brand · nbinding design</title>
<link rel="stylesheet" href="../src/nb.css">
<link rel="stylesheet" href="docs.css">
<script type="module" src="docs.js"></script>
</head>
<body>
<header data-docs-header></header>
<main id="main" class="docs-main" tabindex="-1">
<h1 class="nb-display">Brand</h1>
<p class="nb-lead">The mark is a square hatched both ways: the overlap the system is built around. It inherits the text colour, so it works in light and dark.</p>

<template class="docs-src" data-title="Wordmark" data-notes="Mark plus product name in Bricolage Grotesque 800. The whole thing is one link.">
<a class="nb-brand" href="#"><span data-mark="26"></span><span>calshare</span></a>
</template>

<template class="docs-src" data-title="Large wordmark" data-notes="For the desktop sidebar.">
<a class="nb-brand nb-brand--lg" href="#"><span data-mark="32"></span><span>calshare</span></a>
</template>

<template class="docs-src" data-title="Mark on its own" data-notes="Decorative (aria-hidden). Pair it with a visible or visually hidden name.">
<div class="nb-row"><span data-mark="26"></span><span data-mark="40"></span><span data-mark="64"></span></div>
</template>


</main>
<footer class="docs-foot" data-docs-footer></footer>
</body>
</html>
