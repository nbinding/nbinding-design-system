<!doctype html>
<html lang="en" data-root="..">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; base-uri 'none'; form-action 'none'">
<title>Journey · nbinding design</title>
<link rel="stylesheet" href="../src/nb.css">
<link rel="stylesheet" href="docs.css">
<script type="module" src="docs.js"></script>
</head>
<body>
<header data-docs-header></header>
<main id="main" class="docs-main" tabindex="-1">
<h1 class="nb-display">Journey</h1>
<p class="nb-lead">For long tasks done over weeks: where you are, what is done, what can happen and what comes next. Status reads by shape: a plain number, a ring for now, solid with a tick for done, dotted with a question mark for come back to this.</p>

<template class="docs-src" data-title="Status marks" data-notes="">
<p class="nb-row"><span class="nb-status" aria-label="Step 4, to do">4</span><span class="nb-status nb-status--now" aria-label="Step 3, current">3</span><span class="nb-status nb-status--done" role="img" aria-label="Done"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span><span class="nb-status nb-status--later" role="img" aria-label="Come back to this">?</span></p>
</template>

<template class="docs-src" data-title="Timeline" data-notes="Every step at a glance. The current step has aria-current=&quot;step&quot;. Titles can be links to the step.">
<ol class="nb-timeline" aria-label="Steps"><li class="nb-timeline__phase">Before the Conditional Order</li><li class="nb-timeline__item nb-timeline__item--done"><span class="nb-status nb-status--done" role="img" aria-label="Done"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span><span class="nb-timeline__title">Put your agreement in writing</span></li><li class="nb-timeline__item nb-timeline__item--done"><span class="nb-status nb-status--done" role="img" aria-label="Done"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span><span><span class="nb-timeline__title">Gather your figures</span><span class="nb-timeline__detail">Done from your D81</span></span></li><li class="nb-timeline__item" aria-current="step"><span class="nb-status nb-status--now">3</span><span><a class="nb-timeline__title" href="#">Decide when the home changes hands</a><span class="nb-timeline__detail">You are here</span></span></li><li class="nb-timeline__item"><span class="nb-status">4</span><span class="nb-timeline__title">Update wills and nominations</span></li></ol>
</template>

<template class="docs-src" data-title="Badges" data-notes="An icon in a circle. Use a different shape for each meaning as well as a different icon.">
<p class="nb-row"><span class="nb-badge nb-badge--solid"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span><span class="nb-badge nb-badge--ring"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6V14M12 17.5v.01"/></svg></span><span class="nb-badge nb-badge--dashed"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"/></svg></span><span class="nb-badge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></span></p>
</template>

<template class="docs-src" data-title="Icon list" data-notes="A few possible outcomes, each with what it means and what to do.">
<ul class="nb-icon-list" aria-label="What the judge can do"><li><span class="nb-badge nb-badge--solid"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span><div><h3>Approves</h3><p>The order is sealed and binds you both.</p><p class="nb-icon-list__then">Go to step 13.</p></div></li><li><span class="nb-badge nb-badge--ring"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6V14M12 17.5v.01"/></svg></span><div><h3>Asks questions</h3><p>A figure needs explaining or a clause rewording.</p><p class="nb-icon-list__then">Reply in writing by the date given.</p></div></li><li><span class="nb-badge nb-badge--dashed"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"/></svg></span><div><h3>Lists a short hearing</h3><p>Usually brief, to understand something in person.</p><p class="nb-icon-list__then">Both attend and explain the agreement.</p></div></li><li><span class="nb-badge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></span><div><h3>Refuses</h3><p>Rare when the figures are full.</p><p class="nb-icon-list__then">Amend and resubmit.</p></div></li></ul>
</template>

<template class="docs-src" data-title="Answers" data-notes="A summary to check before moving on. A dotted question mark marks an answer left for later.">
<dl class="nb-answers"><div class="nb-answers__row"><dt><span class="nb-status nb-status--sm nb-status--done" role="img" aria-label="Answered"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>Value today</dt><dd>£425,000</dd></div><div class="nb-answers__row"><dt><span class="nb-status nb-status--sm nb-status--later" role="img" aria-label="Come back to this">?</span><span>Early repayment charge<small>You chose to come back to this</small></span></dt><dd><a href="#">Answer</a></dd></div></dl>
</template>

<template class="docs-src" data-title="Dated list" data-notes="What happens next and when. Pair it with a calendar file so the dates reach people's own calendars.">
<ul class="nb-dates"><li><span class="nb-when" aria-hidden="true"><b>9</b><span>Apr</span></span><span><span class="nb-sr-only">9 April: </span><strong>Home goes on the market</strong><small>Within 28 days of the order</small></span></li><li><span class="nb-when" aria-hidden="true"><b>30</b><span>Apr</span></span><span><span class="nb-sr-only">30 April: </span><strong>Lump sum of £40,000 to Alex</strong><small>From Sam, by bank transfer</small></span></li></ul>
</template>

</main>
<footer class="docs-foot" data-docs-footer></footer>
</body>
</html>
