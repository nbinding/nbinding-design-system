<!doctype html>
<html lang="en" data-root="..">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; base-uri 'none'; form-action 'none'">
<title>Poster · nbinding design</title>
<link rel="stylesheet" href="../src/nb.css">
<link rel="stylesheet" href="docs.css">

<body>
<header data-docs-header></header>
<main id="main" class="docs-main" tabindex="-1">
<h1 class="nb-display">Poster</h1>
<p class="nb-lead">The settled date as something worth keeping. Dark in light mode, light in dark mode.</p>

<template class="docs-src" data-title="One day" data-notes="">
<div class="nb-poster"><p class="nb-poster__what">Dinner · Sam &amp; Alex</p><ul class="nb-poster__days"><li><h2 class="nb-sr-only">Saturday 21 November 2026</h2><span class="nb-poster__line" aria-hidden="true">Saturday</span><span class="nb-poster__day" aria-hidden="true">21</span><span class="nb-poster__line" aria-hidden="true">November 2026</span><p class="nb-poster__note">Evening</p></li></ul><div class="nb-poster__hatch" aria-hidden="true"></div></div>
</template>

<template class="docs-src" data-title="Several days" data-notes="">
<div class="nb-poster nb-poster--multi"><p class="nb-poster__what">Hike · 2 days</p><ul class="nb-poster__days"><li><h2 class="nb-sr-only">Saturday 21 November 2026</h2><span class="nb-poster__day" aria-hidden="true">21</span><span class="nb-poster__line" aria-hidden="true">Saturday</span><span class="nb-poster__line" aria-hidden="true">November 2026</span><p class="nb-poster__note">Any time</p></li><li><h2 class="nb-sr-only">Wednesday 25 November 2026</h2><span class="nb-poster__day" aria-hidden="true">25</span><span class="nb-poster__line" aria-hidden="true">Wednesday</span><span class="nb-poster__line" aria-hidden="true">November 2026</span><p class="nb-poster__note">Evening (still a maybe)</p></li></ul><div class="nb-poster__hatch" aria-hidden="true"></div></div>
</template>

<template class="docs-src" data-title="Group" data-notes="">
<div class="nb-poster"><p class="nb-poster__what">Hike · 4 people</p><ul class="nb-poster__days"><li><h2 class="nb-sr-only">Saturday 21 November 2026</h2><span class="nb-poster__line" aria-hidden="true">Saturday</span><span class="nb-poster__day" aria-hidden="true">21</span><span class="nb-poster__line" aria-hidden="true">November 2026</span><p class="nb-poster__note">4 of 4 can make it</p><p class="nb-poster__note">Nat, Sam · PD, Sam · 68, Jo</p></li></ul><div class="nb-poster__hatch" aria-hidden="true"></div></div>
</template>


</main>
<footer class="docs-foot" data-docs-footer></footer>
</body>
</html>
